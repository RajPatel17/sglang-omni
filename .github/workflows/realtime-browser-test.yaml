name: Realtime Browser Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playback-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test realtime playback state
        run: node --test playground/qwen-omni/realtime/playback.test.js
